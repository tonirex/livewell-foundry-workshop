# content/config/workshop.yaml
# LiveWell Coach — Microsoft Foundry workshop for the Health Promotion Board (Singapore).
#
# This is the ONE config file allowed to hold environment identifiers (subscription / tenant IDs).
# Lab pages, slides and script constants use NAMES only; runtime values (endpoints, IDs) live in
# .azure/<env>/.env and are rendered into content/config/values.md by scripts/render-values.py.
# Values marked TODO are listed in ASSUMPTIONS.md under "Values Antonia must supply".

workshop:
  name: "LiveWell Coach — Microsoft Foundry Workshop"
  short_name: "livewell"
  customer: "Health Promotion Board (Singapore)"
  owner: "Antonia Chen (Sr Solution Engineer, Microsoft Singapore)"
  date: "TODO"                     # workshop day (YYYY-MM-DD)
  participant_count: "TODO"        # confirmed HPB head-count (planning default 20)
  planning_cohort_size: 20
  guest_wifi:
    ssid: "TODO"
    code: "TODO"
  logistics:
    personal_laptops_required: true   # WOG devices cannot sign in to external Entra tenants
    authenticator_registration_at_first_sign_in: true

  rails: [navigator, builder]
  default_rail: navigator
  agent_naming:
    portal_agent: "livewell-<initials>"             # Lab 0 portal agent, reused by Navigator labs
    builder_agent: "livewell-<INITIALS>-<role>"     # created by content/assets/labN_*.py
    demo_prefix: "livewell-demo-"                   # facilitator demo agents — never deleted by scripts
    protected_prefixes: ["livewell-demo-", "livewell-workshop-"]
    demo_agents:                                    # created by demos/ (Phase 5); referenced in the run of show
      lab0: "livewell-demo-lab0"
      knowledge: "livewell-demo-kb"
      guarded: "livewell-demo-guarded"
      tools: "livewell-demo-tools"
      fabric: "livewell-demo-fabric"

# ---------------------------------------------------------------------------
# Names shared by both azd environments (SPEC.md §8.3). <env> = mcaps | sponsor.
# ---------------------------------------------------------------------------
names:
  location: "swedencentral"               # single region for EVERY resource (never Southeast Asia)
  fallback_location: "northcentralus"     # documented fallback only (SPEC.md §8.2)
  resource_group: "rg-livewell-workshop-<env>"
  foundry_account: "aif-livewell-<env>"
  foundry_project: "livewell-workshop"
  search_service: "srch-livewell-<env>"
  fabric_capacity: "fablivewell<env>"
  fabric_workspace: "HPB Resident 360"
  lakehouse: "lh_resident360"
  ontology: "resident_ontology"
  data_agent: "Resident360 Ontology Agent"
  knowledge_base: "livewell-guides-kb"
  knowledge_source: "livewell-guides-ks"
  knowledge_container: "livewell-guides"
  mcp_app: "ca-mcp-activities-<env>"
  mcp_connection: "livewell-activities-mcp"        # project connection to the activities MCP server
  profile_openapi_tool: "livewell-profile"         # Navigator OpenAPI tool over the profile endpoint
  fabric_connection: "livewell-fabric-resident360" # project connection created by Add tool -> Fabric IQ
  kb_mcp_connection: "livewell-guides-kb-mcp"      # project connection to the knowledge base MCP endpoint
  hosted_agent: "livewell-workshop-hosted"         # Lab 4 facilitator hosted agent (protected prefix)
  rai_policy: "livewell-guardrails"
  medication_blocklist: "livewell-medication-dosage"
  budget: "budget-livewell-<env>"

models:
  default: "model-router"
  fallback: "gpt-4.1-mini"
  embeddings: "text-embedding-3-large"
  deployment_type: "GlobalStandard"
  tpm_cap_thousands: 100
  forbidden: ["PTU", "partner models (Anthropic, Mistral, Cohere)"]

modes:
  project_mode: "shared-project"     # shared-project | project-per-attendee
  fabric_bridge: true                # FABRIC_BRIDGE; false = profile tool reads citizens.json, Fabric step skipped

# ---------------------------------------------------------------------------
# Environments. IDs are allowed here (and only here) — see header comment.
# ---------------------------------------------------------------------------
environments:
  mcaps:
    purpose: "dry run"
    subscription_id: "15715b5a-037a-4d59-bf60-2fa0986a3179"
    tenant_id: "108f6739-7d66-44bd-b535-c1812dab17b5"
    facilitator_upns:
      - "admin@mngenvmcap761802.onmicrosoft.com"   # Fabric capacity admin + Foundry Project Manager
    lab_accounts:
      prefix: "hpb.lab"
      count: 20
      pattern: "hpb.lab01 … hpb.lab20"
    budget_alerts_usd: [150, 300]
  sponsor:
    purpose: "delivery"
    subscription_id: "TODO"
    tenant_id: "TODO"
    facilitator_upns: ["TODO"]
    lab_accounts:
      prefix: "hpb.lab"
      count: 20
    budget_alerts_usd: [150, 300]

# ---------------------------------------------------------------------------
# Upstream kit (vendored under content/data/resident360/ with NOTICE.md).
# ---------------------------------------------------------------------------
upstream:
  resident360_kit:
    repo: "https://github.com/stellistic/resident-360-data-workshop"
    pinned_sha: "3ce11e429b8e306e9e2ff115e42b838dbf47b777"
    pinned_on: "2026-09-28"
    licence: "MIT"

labs:
  - id: lab-00
    title: "Setup & first agent"
    minutes: 15
    rails: [navigator]
    patterns: [10]
  - id: lab-01
    title: "Agents & Knowledge — Foundry IQ"
    minutes: 40
    rails: [navigator, builder]
    patterns: [1, 4]
  - id: lab-02
    title: "Guardrails, Evaluations & Tracing"
    minutes: 40
    rails: [navigator, builder]
    patterns: [5, 7, 10]
  - id: lab-03
    title: "Tools, MCP & Memory — hyper-personalisation"
    minutes: 40
    rails: [navigator, builder]
    patterns: [2, 3, 6, 8, 9]
    optional_step: fabric-step
  - id: lab-04
    title: "Multi-agent & Hosted deploy"
    minutes: 30
    rails: [builder]
    facilitator_only: true
    patterns: [3, 9, 10]
  - id: bridge-spotlight
    title: "Two IQs, one agent"
    minutes: 10
    facilitator_only: true
