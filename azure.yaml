# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# LiveWell Coach — Microsoft Foundry workshop. One template, two azd environments (mcaps, sponsor).
#   azd env new mcaps   → scripts/preflight.sh → scripts/provision.sh (wraps azd provision)
# Per-env parameters: infra/env/<AZURE_ENV_NAME>.bicepparam, copied to infra/main.bicepparam by the
# preprovision hook (scripts/select-params.py). See content/admin/ADMIN-SETUP.md.
name: livewell-foundry-workshop
metadata:
  template: livewell-foundry-workshop@0.2.0

requiredVersions:
  azd: ">= 1.34.0"
  extensions:
    azure.ai.agents: ">= 1.0.0-beta.9"

infra:
  provider: bicep
  path: infra
  module: main

hooks:
  preprovision:
    posix:
      shell: sh
      run: python3 scripts/select-params.py --hook
      interactive: false
      continueOnError: false
    windows:
      shell: pwsh
      run: python scripts/select-params.py --hook
      interactive: false
      continueOnError: false

services:
  # Lab 3 — activities MCP server (FastMCP, streamable HTTP at /mcp) on Azure Container Apps.
  # Bicep creates a placeholder app tagged azd-service-name=mcp-activities; `azd deploy mcp-activities`
  # builds the image remotely in ACR and swaps it in (Phase 4).
  mcp-activities:
    project: content/assets/mcp-activities
    host: containerapp
    language: python
    docker:
      path: Dockerfile
      remoteBuild: true

  # Lab 4 — facilitator-only hosted agent (livewell-workshop-hosted). Deployed with the azd AI agents
  # extension (`azd deploy hosted-agent-example`) once Phase 4 adds main.py / requirements.txt. The
  # extension targets the project in AZURE_AI_PROJECT_ID / AZURE_AI_PROJECT_ENDPOINT (Bicep outputs).
  hosted-agent-example:
    project: content/assets/hosted-agent-example
    host: azure.ai.agent
    language: python
    kind: hosted
    name: livewell-workshop-hosted
    displayName: LiveWell Coach (hosted)
    description: LiveWell Coach packaged as a hosted agent (Responses protocol), facilitator demo in Lab 4.
    metadata:
      tags:
        - LiveWell
        - Agent Framework
        - Hosted Agent
        - Responses Protocol
        - Lab 4
    protocols:
      - protocol: responses
        version: 2.0.0
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      AZURE_AI_PROJECT_ENDPOINT: ${AZURE_AI_PROJECT_ENDPOINT}
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
